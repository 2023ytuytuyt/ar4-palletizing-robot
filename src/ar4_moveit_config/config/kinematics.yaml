# Kinematics solver configuration for the AR4 palletizing robot (MoveIt 2, ROS 2 Jazzy)
#
# KDL is the default numerical IK solver in MoveIt 2. It works for the 7-DOF
# chain (joint_7 prismatic + joint_1..joint_6 revolute) without needing a
# closed-form solver. If a faster/analytical solver is written later (e.g. an
# IKFast plugin for the 6R arm), replace the solver name here.
ar4_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  kinematics_solver_attempts: 3
